function tickRunner(dt){if(!run)return;const r=run;r.clock=performance.now();if(r.clock<r.grace)return;r.gap+=dt*.0135;if(r.lastTap!==null&&r.clock-r.lastTap>355&&r.clock>=r.stumbleUntil)stumble('切换不够快，绊倒！');if(mode!=='runner')return;if(r.clock>=r.stumbleUntil)screen.querySelector('.runner').classList.remove('falling');const progress=Math.max(0,100-r.gap);screen.querySelector('.fill').style.width=`${progress}%`;screen.querySelector('.track').setAttribute('aria-valuenow',Math.round(progress));screen.querySelector('.run-hero').style.bottom=`${progress*.78}%`;if(r.gap>=100)runnerEnd(false)}
const finalCuts={fight:[['fight','一剑定乾坤','少主：“等等！你这不按套路来啊！”'],['fight','轰——！！','少主被正面击飞，山门的石阶一路炸裂。'],['escape','全宗门欢呼！','大师兄：“师尊，这次真可以下班了。”']],bind:[['bind','锁链反噬！','少主：“这是我的法器啊！”'],['bind','原地打包','锁链将少主牢牢捆在飞舟上。'],['escape','智取成功！','奶龙：“谁把快递签收一下？”']],escape:[['deck','守住大师兄！','你挡在大师兄身前。'],['escape','冲出飞舟','少主扑空，两人翻身落在云台。'],['escape','全员平安！','奶龙：“先撤！留得青山在！”']]};
function route(){return flags.c10==='finishfight'?'fight':flags.c10==='finishbind'?'bind':'escape'}
function playFinale(stage){if(stage>=3){ending();return}setMode('finale');finalStage=stage;const [art,title,line]=finalCuts[route()][stage];screen.innerHTML=`<section class="scene flash">${image(art)}<span class="chapter">决战终章 · ${stage+1} / 3</span><h1 class="finale-title">${title}</h1><div class="caption"><div class="line">${line}</div><div class="tap-hint">轻触继续</div><div class="voice-status">配音准备中</div></div></section>`;screen.querySelector('.scene').onclick=()=>{if(!paused)playFinale(stage+1)};delay=Math.max(2900,line.length*85);sound(stage===2?'win':'boom');replayVoice()}
function ending(){setMode('ending');const rt=route();seen.add(rt);try{localStorage.setItem('xianxia-v11-endings',JSON.stringify([...seen]))}catch{};const cfg=rt==='fight'?['完美逆袭','S · 传说结局','少主当众认输，大师兄平安归来。','掌门：好！现在下班！','fight']:rt==='bind'?['智取魔王','A · 隐藏结局','反派被自己的锁链困住，求饶的样子有点熟悉。','奶龙：尊贵的捆绑体验官，欢迎下次光临！','bind']:['险胜逃生','B · 生还结局','你救回了大师兄，守住了宗门，但少主暂时逃走。','大师兄：师尊，门还是得修。','escape'];const count=Object.keys(choiceMap).filter(p=>flags[choiceMap[p]]).length;screen.innerHTML=`<section class="result">${image(cfg[4])}<span class="eyebrow">${cfg[1]}</span><h1>${cfg[0]}</h1><p>${cfg[2]}</p><div class="stats"><div><b>${deathNum}</b><small>重生次数</small></div><div><b>${count}/10</b><small>剧情抉择</small></div><div><b>${seen.size}/3</b><small>通关路线</small></div></div><p>${cfg[3]}</p><button class="gold" id="replay">再活一世</button><button id="review">回顾当前决战</button><button id="endHome">返回封面</button></section>`;voice.speak([{text:cfg[0]+'。'+cfg[2],who:'旁白'},{text:cfg[3],who:'旁白'}]);document.querySelector('#replay').onclick=()=>{flags={};known.clear();deathNum=0;page=0;shot=0;render()};document.querySelector('#review').onclick=()=>playFinale(0);document.querySelector('#endHome').onclick=cover}
function pause(){if(paused||['cover','loading'].includes(mode))return;paused=true;voice.pause();document.body.classList.add('paused');if(run){run.held.clear();run.last='';run.lastTap=null;run.grace=run.clock+700;screen.querySelectorAll('.active').forEach(x=>x.classList.remove('active'))}document.querySelector('#pauseDialog').showModal()}
function resume(){paused=false;voice.resume();if(run){run.clock=performance.now();run.grace=run.clock+700}lastFrame=performance.now();document.body.classList.remove('paused');document.querySelector('#pauseDialog').close()}
document.querySelector('#pause').onclick=pause;document.querySelector('#resume').onclick=resume;document.querySelector('#home').onclick=()=>{resume();cover()};document.querySelector('#pauseDialog').addEventListener('cancel',e=>{e.preventDefault();resume()});document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent=muted?'音效 关':'音效 开';sound()};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',pause);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(paused)resume();else pause();return}const side=['ArrowLeft','a','A'].includes(e.key)?'L':['ArrowRight','d','D'].includes(e.key)?'R':null;if(side&&mode==='runner'){e.preventDefault();if(!e.repeat)pressFoot(side)}});window.addEventListener('keyup',e=>{const side=['ArrowLeft','a','A'].includes(e.key)?'L':['ArrowRight','d','D'].includes(e.key)?'R':null;if(side)releaseFoot(side)});
function frame(now){const dt=Math.min(1000,Math.max(0,now-lastFrame));lastFrame=now;if(!paused){voice.update(dt);elapsed+=dt;if(mode==='story'){const s=currentShots()[shot];const n=Math.min(s.line.length,Math.floor(elapsed/35));if(n!==typing){typing=n;screen.querySelector('.line').textContent=s.line.slice(0,n)}if(elapsed>=delay&&!voice.blocking)advance()}else if(mode==='runner')tickRunner(dt);else if(mode==='runnerWin'&&elapsed>=delay){page++;shot=0;render()}else if(mode==='finale'&&elapsed>=delay&&!voice.blocking)playFinale(finalStage+1)}frameId=requestAnimationFrame(frame)}
document.querySelector('#voice').onclick=()=>{voice.setEnabled(!voice.enabled);if(voice.enabled){voice.prime();replayVoice()}};document.querySelector('#revoice').onclick=()=>{if(!voice.enabled)voice.setEnabled(true);replayVoice()};
cover();lastFrame=performance.now();frameId=requestAnimationFrame(frame);
</script></body></html>
